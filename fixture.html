<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fixture — Mi Álbum Mundial 2026</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1814">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1ead8;--paper-2:#e8dfc4;--paper-3:#ddd0ad;
  --ink:#1a1814;--ink-soft:#3d362b;--rule:#c9bb95;
  --gold:#c89a3a;--gold-deep:#8c6614;
  --red:#e06800;--green:#2f7a3e;--teal:#0f6e6a;
  --wc-blue:#3878c0;--wc-blue-dark:#1c3870;--wc-blue-light:#5fb4e0;
  --wc-orange:#e07a30;--wc-gold:#f0c038;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:'Archivo',sans-serif;overflow-x:hidden}
body{padding-top:var(--safe-top);padding-bottom:calc(24px + var(--safe-bottom))}

/* ── Header ── */
.fix-header{
  background:var(--ink);color:var(--paper);
  padding:14px 16px calc(14px + var(--safe-top)) 16px;
  display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:50;
}
.fix-back{
  background:none;border:1.5px solid rgba(255,255,255,.3);color:var(--paper);
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;
  padding:6px 10px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;gap:5px;
}
.fix-back:hover{background:rgba(255,255,255,.12)}
.fix-header-title{
  font-family:'Archivo Black',sans-serif;font-size:14px;
  text-transform:uppercase;letter-spacing:.1em;
}
.fix-header-sub{
  font-family:'JetBrains Mono',monospace;font-size:9px;
  opacity:.6;letter-spacing:.1em;margin-top:1px;
}

/* ── Próximo partido banner ── */
.next-banner{
  background:var(--wc-blue-dark);color:#fff8ee;
  padding:14px 16px;
  display:flex;align-items:center;gap:12px;
}
.nb-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin-bottom:3px}
.nb-match{font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.01em}
.nb-time{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.8;margin-top:3px}
.nb-countdown{margin-left:auto;text-align:right;flex-shrink:0;min-width:48px}
.nb-count-n{font-family:'Archivo Black',sans-serif;font-size:28px;line-height:1}
.nb-count-l{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:.7;letter-spacing:.1em}

/* ── Filtros ── */
.fix-filters-wrap{
  padding:12px 16px;background:var(--paper-2);
  border-bottom:2px solid var(--ink);
  position:sticky;top:58px;z-index:40;
}
.fix-filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.fix-filter-row:last-child{margin-bottom:0}
.fix-filter-label{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);flex-shrink:0;min-width:52px;
}
.fchip{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.05em;
  background:var(--paper);border:1px solid var(--rule);color:var(--ink-soft);
  padding:5px 9px;cursor:pointer;white-space:nowrap;transition:all .12s;
}
.fchip:hover{border-color:var(--ink);color:var(--ink)}
.fchip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fchip.today-chip.active{background:var(--wc-orange);border-color:var(--wc-orange)}
.fchip.group-chip.active{background:var(--wc-blue-dark);border-color:var(--wc-blue-dark)}

/* ── Lista de partidos ── */
.fix-body{padding:0 16px}
.fix-day{padding-top:14px}
.fix-day-label{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft);
  padding:6px 0;border-bottom:1px solid var(--rule);margin-bottom:8px;
  display:flex;align-items:center;gap:8px;
}
.day-badge{
  font-family:'JetBrains Mono',monospace;font-size:8px;
  padding:2px 6px;letter-spacing:.06em;
}
.day-badge.hoy{background:var(--wc-orange);color:#fff}
.day-badge.open{background:var(--wc-blue-dark);color:#fff}
.day-badge.final{background:var(--gold-deep);color:#fff}

.match-card{
  display:grid;grid-template-columns:1fr 64px 1fr;
  align-items:center;gap:8px;
  background:var(--paper-2);border:1.5px solid var(--rule);
  border-left:3px solid var(--wc-blue);
  padding:10px 12px 8px;margin-bottom:6px;position:relative;
}
.match-card.played{border-left-color:var(--rule);opacity:.6}
.match-card.live{border-left-color:var(--red)}
.match-card.next-match{border-left-color:var(--wc-gold);background:#fffbe8}
.match-card.ko{border-left-color:var(--wc-blue-light)}
.match-card.hidden{display:none}

.match-team{font-family:'Archivo Black',sans-serif;font-size:12px;line-height:1.3}
.match-team.home{text-align:right}
.flag{font-size:18px;display:block;line-height:1.2}

.match-center{text-align:center}
.match-time{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.02em}
.match-vs{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink-soft)}
.match-result{font-family:'Archivo Black',sans-serif;font-size:15px;color:var(--ink)}
.match-live-dot{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--red)}

.match-meta{
  position:absolute;top:4px;right:8px;
  font-family:'JetBrains Mono',monospace;font-size:8px;
  color:var(--ink-soft);letter-spacing:.05em;
}
.match-stadium{
  grid-column:1/-1;font-family:'JetBrains Mono',monospace;font-size:8px;
  color:var(--ink-soft);text-align:center;margin-top:3px;letter-spacing:.04em;
}

/* ── Empty state ── */
.fix-empty{
  text-align:center;padding:40px 20px;
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--ink-soft);letter-spacing:.06em;line-height:1.8;
}

/* ── Footer ── */
.fix-footer{
  text-align:center;padding:20px 16px;
  font-family:'JetBrains Mono',monospace;font-size:9px;
  color:var(--ink-soft);letter-spacing:.06em;line-height:1.8;
  border-top:1px dashed var(--rule);margin-top:16px;
}
.fix-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.fix-legend-item{display:flex;align-items:center;gap:5px;font-size:9px}
.fix-legend-dot{width:10px;height:10px;flex-shrink:0}
</style>
</head>

<!-- Header fijo -->
<div class="fix-header">
  <button class="fix-back" onclick="history.back()">← Volver</button>
  <div>
    <div class="fix-header-title">📅 Fixture Mundial 2026</div>
    <div class="fix-header-sub" id="fix-header-sub">104 partidos · 11 jun – 19 jul</div>
  </div>
</div>

<!-- Banner próximo partido -->
<div class="next-banner" id="nextBanner" style="display:none">
  <div>
    <div class="nb-label">⚡ Próximo partido</div>
    <div class="nb-match" id="nb-match">—</div>
    <div class="nb-time" id="nb-time">—</div>
  </div>
  <div class="nb-countdown">
    <div class="nb-count-n" id="nb-count-n">—</div>
    <div class="nb-count-l" id="nb-count-l">—</div>
  </div>
</div>

<div class="fix-filters-wrap">

    <button class="fchip today-chip" id="fHoy" onclick="toggleFilter('hoy')">⚡ Juegan Hoy</button>

  </div>
  <div class="fix-filter-row">
    <span class="fix-filter-label">Grupo</span>
    <div id="groupChips" style="display:flex;gap:5px;flex-wrap:wrap">
      <!-- generado por JS -->
    </div>
  </div>
  <div class="fix-filter-row">
    <span class="fix-filter-label">Selección</span>
    <div id="teamChips" style="display:flex;gap:5px;flex-wrap:wrap;max-height:68px;overflow-y:auto">
      <!-- generado por JS -->
    </div>
  </div>
</div>

<!-- Lista de partidos -->
<div class="fix-body" id="fixBody"></div>

<div class="fix-empty" id="fixEmpty" style="display:none">
  Sin partidos para los filtros seleccionados.
</div>

<div class="fix-footer">

    <div class="fix-legend-item"><div class="fix-legend-dot" style="background:var(--rule)"></div>Finalizado</div>

</div>

// ─── Estado de filtros ───────────────────────────
const GROUPS = ['A','B','C','D','E','F','G','H','I','J','K','L','R32','R16','QF','SF','3P','FIN'];
const GROUP_LABELS = {A:'A',B:'B',C:'C',D:'D',E:'E',F:'F',G:'G',H:'H',I:'I',J:'J',K:'K',L:'L',
  R32:'R32',R16:'Octavos',QF:'Cuartos',SF:'Semis','3P':'3er Pto.','FIN':'Final'};
const TEAMS = [...new Set(MATCHES.flatMap(m => [m.h, m.a]).filter(t => !t.startsWith('Gana') && !t.startsWith('Mejor') && !t.startsWith('1º') && !t.startsWith('2º') && !t.startsWith('3er') && !t.startsWith('4to') && !t.startsWith('Final')))].sort();
const FLAGS = {};
MATCHES.forEach(m => { if(m.hf) FLAGS[m.h] = m.hf; if(m.af) FLAGS[m.a] = m.af; });

let filterHoy   = false;
let filterGroup = null;
let filterTeam  = null;

// ─── Helpers ──────────────────────────────────────
function matchStatus(m){
  const now = Date.now();
  const start = new Date(m.utc).getTime();
  const end   = start + 110 * 60000;
  if(now > end)   return 'played';
  if(now >= start)return 'live';
  return 'upcoming';
}
function isToday(m){
  const d = new Date(m.utc);
  const now = new Date();
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
}
function formatTime(utc){
  return new Date(utc).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
function formatDay(utc){
  return new Date(utc).toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'});
}
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

// ─── Construir chips de grupos ────────────────────
function buildGroupChips(){
  const wrap = document.getElementById('groupChips');
  const groups = ['A','B','C','D','E','F','G','H','I','J','K','L','R32','R16','QF','SF','3P','FIN'];
  groups.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'fchip group-chip';
    btn.dataset.g = g;
    btn.textContent = GROUP_LABELS[g];
    btn.onclick = () => toggleGroup(g);
    wrap.appendChild(btn);
  });
}
function buildTeamChips(){
  const wrap = document.getElementById('teamChips');
  TEAMS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'fchip';
    btn.dataset.t = t;
    btn.textContent = (FLAGS[t]||'') + ' ' + t;
    btn.onclick = () => toggleTeam(t);
    wrap.appendChild(btn);
  });
}

// ─── Toggle filtros ───────────────────────────────
function toggleFilter(type){
  if(type === 'hoy'){
    filterHoy = !filterHoy;
    filterGroup = null; filterTeam = null;
    document.querySelectorAll('.group-chip,.fchip[data-t]').forEach(b => b.classList.remove('active'));
    document.getElementById('fHoy').classList.toggle('active', filterHoy);
    document.getElementById('fTodos').classList.toggle('active', !filterHoy);
  } else {
    filterHoy = false; filterGroup = null; filterTeam = null;
    document.querySelectorAll('.fchip').forEach(b => b.classList.remove('active'));
    document.getElementById('fTodos').classList.add('active');
  }
  render();
}
function toggleGroup(g){
  filterHoy = false; filterTeam = null;
  filterGroup = filterGroup === g ? null : g;
  document.querySelectorAll('.fchip').forEach(b => b.classList.remove('active'));
  if(filterGroup){
    document.querySelector(`.group-chip[data-g="${g}"]`)?.classList.add('active');
  } else {
    document.getElementById('fTodos').classList.add('active');
  }
  render();
}
function toggleTeam(t){
  filterHoy = false; filterGroup = null;
  filterTeam = filterTeam === t ? null : t;
  document.querySelectorAll('.fchip').forEach(b => b.classList.remove('active'));
  if(filterTeam){
    document.querySelector(`.fchip[data-t="${t}"]`)?.classList.add('active');
  } else {
    document.getElementById('fTodos').classList.add('active');
  }
  render();
}

// ─── Filtrar partidos ─────────────────────────────
function getFiltered(){
  return MATCHES.filter(m => {
    if(filterHoy)   return isToday(m);
    if(filterGroup) return m.g === filterGroup;
    if(filterTeam)  return m.h === filterTeam || m.a === filterTeam;
    return true;
  });
}

// ─── Próximo partido ──────────────────────────────
function updateNextBanner(){
  const now = Date.now();
  const next = MATCHES
    .filter(m => new Date(m.utc).getTime() > now && m.hf && m.af)
    .sort((a,b) => new Date(a.utc)-new Date(b.utc))[0];
  if(!next){ document.getElementById('nextBanner').style.display='none'; return; }
  const ms   = new Date(next.utc).getTime() - now;
  const days = Math.floor(ms / 86400000);
  const hrs  = Math.floor((ms % 86400000) / 3600000);
  const mins = Math.floor((ms % 3600000) / 60000);
  let countN, countL;
  if(days > 0){ countN = days; countL = 'DÍAS'; }
  else if(hrs > 0){ countN = hrs; countL = 'HORAS'; }
  else { countN = mins; countL = 'MIN'; }
  document.getElementById('nb-match').textContent = `${next.hf} ${next.h} vs ${next.a} ${next.af}`;
  document.getElementById('nb-time').textContent  = capitalize(formatDay(next.utc)) + ' · ' + formatTime(next.utc) + ' hs';
  document.getElementById('nb-count-n').textContent = countN;
  document.getElementById('nb-count-l').textContent = countL;
  document.getElementById('nextBanner').style.display = 'flex';
}

// ─── Render principal ─────────────────────────────
function render(){
  const body   = document.getElementById('fixBody');
  const empty  = document.getElementById('fixEmpty');
  const filtered = getFiltered();
  body.innerHTML = '';

  if(!filtered.length){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // Agrupar por día local
  const byDay = new Map();
  filtered.forEach(m => {
    const key = new Date(m.utc).toLocaleDateString([],{year:'numeric',month:'2-digit',day:'2-digit'});
    if(!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(m);
  });

  const nowMs = Date.now();
  let nextRendered = false;

  byDay.forEach((matches, key) => {
    const dayEl = document.createElement('div');
    dayEl.className = 'fix-day';

    // Label del día
    const lbl = document.createElement('div');
    lbl.className = 'fix-day-label';
    const firstDate = new Date(matches[0].utc);
    lbl.textContent = capitalize(formatDay(matches[0].utc));

    const isT = matches.some(isToday);
    const isOpen = matches.some(m => m.id === 1);
    const isFin  = matches.some(m => m.g === 'FIN');
    if(isT) { const b = document.createElement('span'); b.className='day-badge hoy'; b.textContent='HOY'; lbl.appendChild(b); }
    if(isOpen) { const b = document.createElement('span'); b.className='day-badge open'; b.textContent='APERTURA'; lbl.appendChild(b); }
    if(isFin) { const b = document.createElement('span'); b.className='day-badge final'; b.textContent='FINAL'; lbl.appendChild(b); }
    dayEl.appendChild(lbl);

    matches.forEach(m => {
      const st = matchStatus(m);
      const isNext = !nextRendered && st === 'upcoming';
      if(isNext) nextRendered = true;

      const card = document.createElement('div');
      card.className = 'match-card' + (st==='played'?' played':st==='live'?' live':isNext?' next-match':'') + (!m.hf && m.g.length>1?' ko':'');

      const meta = document.createElement('div');
      meta.className = 'match-meta';
      const gLabel = GROUP_LABELS[m.g] || m.g;
      meta.textContent = m.g.length === 1 ? `Grupo ${m.g}` : gLabel;
      card.appendChild(meta);

      const teamHome = document.createElement('div');
      teamHome.className = 'match-team home';
      teamHome.innerHTML = m.hf ? `<span class="flag">${m.hf}</span>${m.h}` : m.h;

      const center = document.createElement('div');
      center.className = 'match-center';
      if(st === 'played'){
        center.innerHTML = `<div class="match-result">? – ?</div><div class="match-vs">FT</div>`;
      } else if(st === 'live'){
        center.innerHTML = `<div class="match-result">? – ?</div><div class="match-live-dot">● EN VIVO</div>`;
      } else {
        center.innerHTML = `<div class="match-time">${formatTime(m.utc)}</div><div class="match-vs">vs</div>`;
      }

      const teamAway = document.createElement('div');
      teamAway.className = 'match-team';
      teamAway.innerHTML = m.af ? `<span class="flag">${m.af}</span>${m.a}` : m.a;

      const stadium = document.createElement('div');
      stadium.className = 'match-stadium';
      stadium.textContent = m.s;

      card.append(teamHome, center, teamAway, stadium);
      dayEl.appendChild(card);
    });

    body.appendChild(dayEl);
  });

  document.getElementById('fix-header-sub').textContent =
    filtered.length + ' partido' + (filtered.length!==1?'s':'') +
    (filterHoy?' · hoy':filterGroup?' · Grupo '+filterGroup:filterTeam?' · '+filterTeam:'') +
    ' · 11 jun – 19 jul';
}

// ─── Init ─────────────────────────────────────────
buildGroupChips();
buildTeamChips();
updateNextBanner();
render();
setInterval(updateNextBanner, 30000);
</script>
