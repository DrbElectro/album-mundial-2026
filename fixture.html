<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fixture — Mi Álbum Mundial 2026</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1814">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1ead8;--paper-2:#e8dfc4;--paper-3:#ddd0ad;
  --ink:#1a1814;--ink-soft:#3d362b;--rule:#c9bb95;
  --gold:#c89a3a;--gold-deep:#8c6614;
  --red:#e06800;--green:#2f7a3e;
  --wc-blue:#3878c0;--wc-blue-dark:#1c3870;--wc-blue-light:#5fb4e0;
  --wc-orange:#e07a30;--wc-gold:#f0c038;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:'Archivo',sans-serif;overflow-x:hidden}
body{padding-top:var(--safe-top);padding-bottom:calc(32px + var(--safe-bottom))}

/* ── Header ── */
.fix-header{
  background:var(--ink);color:var(--paper);
  padding:14px 16px;padding-top:calc(14px + var(--safe-top));
  display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:50;
}
.fix-back{
  background:none;border:1.5px solid rgba(255,255,255,.3);color:var(--paper);
  font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;
  padding:7px 12px;cursor:pointer;flex-shrink:0;
}
.fix-back:hover{background:rgba(255,255,255,.12)}
.fix-header-title{font-family:'Archivo Black',sans-serif;font-size:16px;text-transform:uppercase;letter-spacing:.1em}
.fix-header-sub{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.6;letter-spacing:.1em;margin-top:2px}

/* ── Banner próximo ── */
.next-banner{
  background:var(--wc-blue-dark);color:#fff8ee;padding:14px 16px;
  display:flex;align-items:center;gap:12px;
}
.nb-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-bottom:4px}
.nb-match{font-family:'Archivo Black',sans-serif;font-size:16px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.nb-match .nf{width:28px;height:19px;flex-shrink:0;border:1px solid rgba(255,255,255,.3)}
.nb-match .nf svg{display:block;width:100%;height:100%}
.nb-time{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.8;margin-top:4px}
.nb-countdown{margin-left:auto;text-align:right;flex-shrink:0;min-width:52px}
.nb-count-n{font-family:'Archivo Black',sans-serif;font-size:30px;line-height:1}
.nb-count-l{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:.7;letter-spacing:.1em}

/* ── Filtros ── */
.fix-filters-wrap{
  padding:12px 16px;background:var(--paper-2);
  border-bottom:2px solid var(--ink);
  position:sticky;top:58px;z-index:40;
}
.fix-filter-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.fix-filter-row:last-child{margin-bottom:0}
.fix-filter-label{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);flex-shrink:0;min-width:56px;
}
.fchip{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;
  background:var(--paper);border:1px solid var(--rule);color:var(--ink-soft);
  padding:6px 10px;cursor:pointer;white-space:nowrap;transition:all .12s;
}
.fchip:hover{border-color:var(--ink);color:var(--ink)}
.fchip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fchip.today-chip.active{background:var(--wc-orange);border-color:var(--wc-orange)}

/* Select de grupo */
.group-select{
  flex:1;padding:8px 10px;
  border:1.5px solid var(--rule);background:var(--paper);
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);
  outline:none;cursor:pointer;appearance:auto;
}
.group-select:focus{border-color:var(--ink)}
.group-select.has-value{border-color:var(--wc-blue-dark);background:#eef4ff}

/* ── Dropdown selección ── */
.team-dropdown-wrap{position:relative;flex:1}
.team-search-input{
  width:100%;padding:8px 10px;
  border:1.5px solid var(--rule);background:var(--paper);
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);
  outline:none;
}
.team-search-input:focus{border-color:var(--ink)}
.team-search-input.has-value{border-color:var(--wc-blue-dark);background:#eef4ff}
.team-dropdown{
  position:absolute;top:100%;left:0;right:0;z-index:100;
  background:var(--paper);border:1.5px solid var(--ink);
  border-top:none;max-height:220px;overflow-y:auto;
  box-shadow:3px 3px 0 var(--ink);
}
.team-dropdown.hidden{display:none}
.team-option{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;cursor:pointer;
  border-bottom:1px solid var(--rule);
  font-family:'Archivo',sans-serif;font-size:13px;
}
.team-option:last-child{border-bottom:none}
.team-option:hover,.team-option.active{background:var(--paper-2)}
.team-option .to-flag{width:28px;height:19px;flex-shrink:0;border:1px solid var(--rule);overflow:hidden}
.team-option .to-flag svg{display:block;width:100%;height:100%}
.team-clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;font-size:14px;color:var(--ink-soft);
  display:none;
}
.team-clear.visible{display:block}

/* ── Lista de partidos ── */
.fix-body{padding:0 16px}
.fix-day{padding-top:16px}
.fix-day-label{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);
  padding:7px 0;border-bottom:2px solid var(--rule);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.day-badge{font-family:'JetBrains Mono',monospace;font-size:9px;padding:3px 7px;letter-spacing:.06em}
.day-badge.hoy{background:var(--wc-orange);color:#fff}
.day-badge.open{background:var(--wc-blue-dark);color:#fff}
.day-badge.fin{background:var(--gold-deep);color:#fff}

/* ── Tarjeta de partido ── */
.match-card{
  display:grid;grid-template-columns:1fr 72px 1fr;
  align-items:center;gap:10px;
  background:var(--paper-2);border:1.5px solid var(--rule);
  border-left:3px solid var(--wc-blue);
  padding:12px 14px 10px;margin-bottom:8px;position:relative;
}
.match-card.played{border-left-color:var(--rule);opacity:.6}
.match-card.live{border-left-color:var(--red)}
.match-card.next-match{border-left-color:var(--wc-gold);background:#fffbe8}
.match-card.ko{border-left-color:var(--wc-blue-light)}
.match-card.highlighted{background:#eef4ff;border-color:var(--wc-blue)}

.match-team{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.match-team.away{align-items:flex-start}
.match-team-name{font-family:'Archivo Black',sans-serif;font-size:13px;line-height:1.2;text-align:right}
.match-team.away .match-team-name{text-align:left}

/* bandera SVG */
.mf{width:36px;height:24px;flex-shrink:0;border:1px solid var(--rule);overflow:hidden}
.mf svg{display:block;width:100%;height:100%}
.match-team.away .mf{order:-1}

.match-center{text-align:center}
.match-time{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.02em}
.match-vs{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft)}
.match-result{font-family:'Archivo Black',sans-serif;font-size:17px;color:var(--ink)}
.match-live-dot{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--red)}

.match-meta{
  position:absolute;top:0;left:0;right:0;
  font-family:'Archivo Black',sans-serif;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;
  background:var(--ink);color:var(--paper);
  padding:3px 10px;text-align:center;
}
.match-card{padding-top:26px}
.match-stadium{
  grid-column:1/-1;font-family:'JetBrains Mono',monospace;font-size:9px;
  color:var(--ink-soft);text-align:center;margin-top:4px;letter-spacing:.04em;
}

/* ── KO teams (no flag) ── */
.match-team-ko{font-family:'Archivo',sans-serif;font-size:12px;color:var(--ink-soft);text-align:right;line-height:1.4}
.match-team.away .match-team-ko{text-align:left}

/* ── Empty / Footer ── */
.fix-empty{text-align:center;padding:48px 20px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);letter-spacing:.06em;line-height:2}
.fix-footer{text-align:center;padding:24px 16px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);letter-spacing:.06em;line-height:1.8;border-top:1px dashed var(--rule);margin-top:16px}
.fix-legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.fix-legend-item{display:flex;align-items:center;gap:5px;font-size:10px}
.fix-legend-dot{width:12px;height:12px;flex-shrink:0}
</style>
</head>
<body>

<div class="fix-header">
  <button class="fix-back" onclick="history.back()">← Volver</button>
  <div>
    <div class="fix-header-title">📅 Fixture Mundial 2026</div>
    <div class="fix-header-sub" id="fix-header-sub">104 partidos · 11 jun – 19 jul</div>
  </div>
</div>

<div class="next-banner" id="nextBanner" style="display:none">
  <div style="flex:1;min-width:0">
    <div class="nb-label">⚡ Próximo partido</div>
    <div class="nb-match" id="nb-match">—</div>
    <div class="nb-time" id="nb-time">—</div>
  </div>
  <div class="nb-countdown">
    <div class="nb-count-n" id="nb-count-n">—</div>
    <div class="nb-count-l" id="nb-count-l">—</div>
  </div>
</div>

<div class="fix-filters-wrap">
  <!-- Fila 1: vista rápida -->
  <div class="fix-filter-row">
    <span class="fix-filter-label">Vista</span>
    <button class="fchip today-chip" id="fHoy" onclick="toggleFilter('hoy')">⚡ Hoy</button>
    <button class="fchip active" id="fTodos" onclick="toggleFilter('todos')">Todos</button>
  </div>
  <!-- Fila 2: grupos -->
  <div class="fix-filter-row">
    <span class="fix-filter-label">Grupo</span>
    <select class="group-select" id="groupSelect" onchange="onGroupSelect(this.value)">
      <option value="">Todos los grupos</option>
      <option value="A">Grupo A</option>
      <option value="B">Grupo B</option>
      <option value="C">Grupo C</option>
      <option value="D">Grupo D</option>
      <option value="E">Grupo E</option>
      <option value="F">Grupo F</option>
      <option value="G">Grupo G</option>
      <option value="H">Grupo H</option>
      <option value="I">Grupo I</option>
      <option value="J">Grupo J</option>
      <option value="K">Grupo K</option>
      <option value="L">Grupo L</option>
      <option value="R32">Ronda de 32</option>
      <option value="R16">Octavos de final</option>
      <option value="QF">Cuartos de final</option>
      <option value="SF">Semifinales</option>
      <option value="3P">Tercer puesto</option>
      <option value="FIN">Final</option>
    </select>
  </div>
  <!-- Fila 3: selección con dropdown+búsqueda -->
  <div class="fix-filter-row">
    <span class="fix-filter-label">Selección</span>
    <div class="team-dropdown-wrap" id="teamDropWrap">
      <input type="text" class="team-search-input" id="teamSearch"
        placeholder="Buscar selección…" autocomplete="off" autocorrect="off"
        oninput="onTeamSearch(this.value)"
        onfocus="openTeamDropdown()"
        onblur="setTimeout(closeTeamDropdown,200)">
      <button class="team-clear" id="teamClear" onclick="clearTeamFilter()">✕</button>
      <div class="team-dropdown hidden" id="teamDropdown"></div>
    </div>
  </div>
</div>

<!-- Barra de estado API -->
<div id="apiStatusBar" style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;
  text-align:right;padding:4px 16px 0;color:var(--ink-soft);min-height:20px"></div>

<div class="fix-body" id="fixBody"></div>
<div class="fix-empty" id="fixEmpty" style="display:none">Sin partidos para los filtros seleccionados.</div>

<div class="fix-footer">
  <div>Horarios en tu hora local · FIFA World Cup 2026</div>
  <div class="fix-legend">
    <div class="fix-legend-item"><div class="fix-legend-dot" style="background:var(--wc-blue)"></div>Por jugar</div>
    <div class="fix-legend-item"><div class="fix-legend-dot" style="background:var(--wc-gold)"></div>Próximo</div>
    <div class="fix-legend-item"><div class="fix-legend-dot" style="background:var(--red)"></div>En vivo</div>
    <div class="fix-legend-item"><div class="fix-legend-dot" style="background:var(--rule)"></div>Finalizado</div>
  </div>
</div>

  {id:102,utc:'2026-07-15T19:00Z',h:'Ganador P99',     a:'Ganador P100',    g:'SF', s:'Mercedes-Benz Stadium, Atlanta'},
  // 3er PUESTO
  {id:103,utc:'2026-07-18T21:00Z',h:'3er Puesto',      a:'4to Puesto',      g:'3P', s:'Hard Rock Stadium, Miami'},
  // FINAL
  {id:104,utc:'2026-07-19T19:00Z',h:'Finalista 1',     a:'Finalista 2',     g:'FIN',s:'MetLife Stadium, New Jersey'},
];

const GROUP_LABELS = {
  A:'A',B:'B',C:'C',D:'D',E:'E',F:'F',G:'G',H:'H',I:'I',J:'J',K:'K',L:'L',
  R32:'Ronda 32',R16:'Octavos',QF:'Cuartos',SF:'Semis','3P':'3er Puesto','FIN':'Final'
};
const TEAMS = [...new Set(
  MATCHES.flatMap(m=>[m.h,m.a])
    .filter(t=>TEAM_ISO[t])
)].sort();

let filterHoy   = false;
let filterGroup = null;
let filterTeam  = null;

// ── API football-data.org ─────────────────────────
const API_KEY  = '4a48a6cf07064ff3822c431323c47a7d';
const API_URL  = 'https://api.football-data.org/v4/competitions/2000/matches';
const API_CACHE_KEY = 'wc2026_api_v2';

// Nombres de la API → nombres en español de nuestra app
const API_TEAM_ES = {
  'Algeria':'Argelia','Argentina':'Argentina','Australia':'Australia',
  'Austria':'Austria','Belgium':'Bélgica','Bosnia-Herzegovina':'Bosnia-Herz.',
  'Brazil':'Brasil','Canada':'Canadá','Cape Verde Islands':'Cabo Verde',
  'Colombia':'Colombia','Congo DR':'RD Congo','Croatia':'Croacia',
  'Curaçao':'Curazao','Czechia':'Rep. Checa','Ecuador':'Ecuador',
  'Egypt':'Egipto','England':'Inglaterra','France':'Francia',
  'Germany':'Alemania','Ghana':'Ghana','Haiti':'Haití',
  'Iran':'Irán','Iraq':'Irak','Ivory Coast':'Costa de Marfil',
  'Japan':'Japón','Jordan':'Jordania','Mexico':'México',
  'Morocco':'Marruecos','Netherlands':'Holanda','New Zealand':'Nueva Zelanda',
  'Norway':'Noruega','Panama':'Panamá','Paraguay':'Paraguay',
  'Portugal':'Portugal','Qatar':'Qatar','Saudi Arabia':'Arabia Saudita',
  'Scotland':'Escocia','Senegal':'Senegal','South Africa':'Sudáfrica',
  'South Korea':'Corea del Sur','Spain':'España','Sweden':'Suecia',
  'Switzerland':'Suiza','Tunisia':'Túnez','Turkey':'Turquía',
  'United States':'Estados Unidos','Uruguay':'Uruguay','Uzbekistan':'Uzbekistán',
};
const API_STAGE_MAP = {
  GROUP_STAGE:'A',LAST_32:'R32',LAST_16:'R16',
  QUARTER_FINALS:'QF',SEMI_FINALS:'SF',THIRD_PLACE:'3P',FINAL:'FIN'
};

// Map<"2026-06-11T19:00" → {status, scoreH, scoreA, htH, htA, homeTeam, awayTeam}>
let _apiScores = new Map();
let _apiLoaded = false;
let _apiTimer  = null;
let _lastUpdate = null;

// Callbacks del bridge Android
function onFixtureData(b64){
  try{
    const json = JSON.parse(atob(b64));
    const data = json.matches || [];
    sessionStorage.setItem(API_CACHE_KEY, JSON.stringify({ts:Date.now(), data}));
    _processApi(data);
  }catch(e){ _updateApiStatusBar(false); }
}
function onFixtureDataErr(code){
  console.warn('[Fixture API Android] error', code);
  _updateApiStatusBar(false);
}

async function fetchLiveData(){
  // Caché en sessionStorage (válida para ambas plataformas)
  try{
    const raw = sessionStorage.getItem(API_CACHE_KEY);
    if(raw){
      const {ts, data} = JSON.parse(raw);
      const hasLive = data.some(m=>m.status==='IN_PLAY'||m.status==='PAUSED');
      const ttl = hasLive ? 30000 : 90000;
      if(Date.now()-ts < ttl){ _processApi(data); return; }
    }
  }catch(_){}

  // Android: bridge nativo (evita bloqueo CORS en file://)
  if(window.Android && typeof Android.fetchFixtureData === 'function'){
    try{ Android.fetchFixtureData(); }
    catch(e){ _updateApiStatusBar(false); }
    return;
  }

  // Web: fetch normal
  try{
    const resp = await fetch(API_URL, {headers:{'X-Auth-Token': API_KEY}});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const json = await resp.json();
    const data = json.matches || [];
    sessionStorage.setItem(API_CACHE_KEY, JSON.stringify({ts:Date.now(), data}));
    _processApi(data);
  }catch(e){
    console.warn('[Fixture API]', e.message);
    _updateApiStatusBar(false);
  }
}

function _processApi(apiMatches){
  _apiScores.clear();
  let hasLive = false;
  for(const m of apiMatches){
    const key = m.utcDate.substring(0,16); // "2026-06-11T19:00"
    const sH = m.score?.fullTime?.home ?? null;
    const sA = m.score?.fullTime?.away ?? null;
    const hH = m.score?.halfTime?.home ?? null;
    const hA = m.score?.halfTime?.away ?? null;
    const home = m.homeTeam?.name ? (API_TEAM_ES[m.homeTeam.name] || m.homeTeam.name) : null;
    const away = m.awayTeam?.name ? (API_TEAM_ES[m.awayTeam.name] || m.awayTeam.name) : null;
    _apiScores.set(key, { status: m.status, scoreH:sH, scoreA:sA, htH:hH, htA:hA, home, away });
    if(m.status==='IN_PLAY'||m.status==='PAUSED') hasLive = true;
  }
  _apiLoaded = true;
  _lastUpdate = new Date();
  _updateApiStatusBar(true, hasLive);
  updateNextBanner();
  render();
  // Auto-refresh: cada 30s si hay partido en vivo, 90s si no
  clearTimeout(_apiTimer);
  _apiTimer = setTimeout(fetchLiveData, hasLive ? 30000 : 90000);
}

function _updateApiStatusBar(ok, hasLive){
  const bar = document.getElementById('apiStatusBar');
  if(!bar) return;
  if(!ok){ bar.textContent='⚠ Sin conexión con la API'; bar.style.color='var(--red)'; return; }
  const t = _lastUpdate ? _lastUpdate.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false}) : '';
  bar.textContent = (hasLive ? '🔴 En vivo · ' : '🟢 ') + 'Actualizado ' + t;
  bar.style.color = hasLive ? 'var(--red)' : 'var(--green)';
}

// Obtiene datos de API para un partido dado su utc
function apiForMatch(m){
  return _apiScores.get(m.utc.substring(0,16)) || null;
}

// ── Helpers ──────────────────────────────────────
function matchStatus(m){
  const api = apiForMatch(m);
  // Si la API responde, usamos su status
  if(api){
    if(api.status==='FINISHED') return 'played';
    if(api.status==='IN_PLAY'||api.status==='PAUSED') return 'live';
    return 'upcoming';
  }
  // Fallback: estimación por tiempo
  const now=Date.now(), start=new Date(m.utc).getTime(), end=start+110*60000;
  if(now>end)    return 'played';
  if(now>=start) return 'live';
  return 'upcoming';
}
function isToday(m){
  const d=new Date(m.utc), n=new Date();
  return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();
}
function formatTime(utc){ return new Date(utc).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false}); }
function formatDay(utc){ return new Date(utc).toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'}); }
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

// ── Select de grupo ───────────────────────────────
function onGroupSelect(val){
  filterHoy=false; filterTeam=null; clearTeamFilter();
  filterGroup=val||null;
  const sel=document.getElementById('groupSelect');
  sel.classList.toggle('has-value',!!filterGroup);
  document.querySelectorAll('.fchip').forEach(b=>b.classList.remove('active'));
  if(!filterGroup) document.getElementById('fTodos').classList.add('active');
  render();
}

// ── Dropdown selección ────────────────────────────
function buildTeamDropdown(filter){
  const dd=document.getElementById('teamDropdown');
  dd.innerHTML='';
  const q=(filter||'').toLowerCase();
  const filtered=TEAMS.filter(t=>!q||t.toLowerCase().includes(q));
  if(!filtered.length){
    dd.innerHTML='<div class="team-option" style="color:var(--ink-soft)">Sin resultados</div>';
    return;
  }
  filtered.forEach(t=>{
    const opt=document.createElement('div');
    opt.className='team-option'+(filterTeam===t?' active':'');
    const svg=flagSvg(t);
    opt.innerHTML=(svg?`<div class="to-flag">${svg}</div>`:'')+`<span>${t}</span>`;
    opt.onclick=()=>selectTeam(t);
    dd.appendChild(opt);
  });
}
function openTeamDropdown(){
  buildTeamDropdown(document.getElementById('teamSearch').value);
  document.getElementById('teamDropdown').classList.remove('hidden');
}
function closeTeamDropdown(){
  document.getElementById('teamDropdown').classList.add('hidden');
}
function onTeamSearch(val){
  buildTeamDropdown(val);
  document.getElementById('teamDropdown').classList.remove('hidden');
  if(!val){ clearTeamFilter(); return; }
}
function selectTeam(t){
  filterTeam=t; filterGroup=null; filterHoy=false;
  document.getElementById('teamSearch').value=t;
  document.getElementById('teamSearch').classList.add('has-value');
  document.getElementById('teamClear').classList.add('visible');
  document.querySelectorAll('.fchip').forEach(b=>b.classList.remove('active'));
  closeTeamDropdown(); render();
}
function clearTeamFilter(){
  filterTeam=null;
  document.getElementById('teamSearch').value='';
  document.getElementById('teamSearch').classList.remove('has-value');
  document.getElementById('teamClear').classList.remove('visible');
  document.getElementById('fTodos').classList.add('active');
  closeTeamDropdown(); render();
}

// ── Toggle filtros ────────────────────────────────
function _resetGroupSelect(){
  const sel=document.getElementById('groupSelect');
  if(sel){ sel.value=''; sel.classList.remove('has-value'); }
}
function toggleFilter(type){
  if(type==='hoy'){
    filterHoy=!filterHoy; filterGroup=null; filterTeam=null;
    clearTeamFilter(); _resetGroupSelect();
    document.getElementById('fHoy').classList.toggle('active',filterHoy);
    document.getElementById('fTodos').classList.toggle('active',!filterHoy);
  } else {
    filterHoy=false; filterGroup=null; filterTeam=null;
    clearTeamFilter(); _resetGroupSelect();
    document.querySelectorAll('.fchip').forEach(b=>b.classList.remove('active'));
    document.getElementById('fTodos').classList.add('active');
  }
  render();
}

// ── Filtrar ───────────────────────────────────────
function getFiltered(){
  return MATCHES.filter(m=>{
    if(filterHoy)   return isToday(m);
    if(filterGroup) return m.g===filterGroup;
    if(filterTeam)  return m.h===filterTeam||m.a===filterTeam;
    return true;
  });
}

// ── Próximo partido ───────────────────────────────
function updateNextBanner(){
  const now=Date.now();
  const next=MATCHES.filter(m=>TEAM_ISO[m.h]&&new Date(m.utc).getTime()>now)
    .sort((a,b)=>new Date(a.utc)-new Date(b.utc))[0];
  if(!next){document.getElementById('nextBanner').style.display='none';return;}
  const ms=new Date(next.utc).getTime()-now;
  const days=Math.floor(ms/86400000), hrs=Math.floor((ms%86400000)/3600000), mins=Math.floor((ms%3600000)/60000);
  const [countN,countL]=days>0?[days,'DÍAS']:hrs>0?[hrs,'HORAS']:[mins,'MIN'];
  // Banderas
  const hf=flagSvg(next.h)||''; const af=flagSvg(next.a)||'';
  document.getElementById('nb-match').innerHTML=
    (hf?`<div class="nf">${hf}</div>`:'')+'<span>'+next.h+'</span><span style="opacity:.5;font-size:12px">vs</span><span>'+next.a+'</span>'+(af?`<div class="nf">${af}</div>`:'');
  document.getElementById('nb-time').textContent=capitalize(formatDay(next.utc))+' · '+formatTime(next.utc)+' hs';
  document.getElementById('nb-count-n').textContent=countN;
  document.getElementById('nb-count-l').textContent=countL;
  document.getElementById('nextBanner').style.display='flex';
}

// ── Render principal ──────────────────────────────
function render(){
  const body=document.getElementById('fixBody');
  const empty=document.getElementById('fixEmpty');
  const filtered=getFiltered().sort((a,b)=>new Date(a.utc)-new Date(b.utc));
  body.innerHTML='';
  if(!filtered.length){empty.style.display='block';return;}
  empty.style.display='none';

  // Agrupar por día local
  const byDay=new Map();
  filtered.forEach(m=>{
    const key=new Date(m.utc).toDateString();
    if(!byDay.has(key))byDay.set(key,[]);
    byDay.get(key).push(m);
  });

  let nextRendered=false;
  byDay.forEach((matches,key)=>{
    const dayEl=document.createElement('div');
    dayEl.className='fix-day';

    const lbl=document.createElement('div');
    lbl.className='fix-day-label';
    lbl.textContent=capitalize(formatDay(matches[0].utc));
    const isT=matches.some(isToday);
    const isOpen=matches.some(m=>m.id===1);
    const isFin=matches.some(m=>m.g==='FIN');
    if(isT){const b=document.createElement('span');b.className='day-badge hoy';b.textContent='HOY';lbl.appendChild(b);}
    if(isOpen){const b=document.createElement('span');b.className='day-badge open';b.textContent='APERTURA';lbl.appendChild(b);}
    if(isFin){const b=document.createElement('span');b.className='day-badge fin';b.textContent='⭐ FINAL';lbl.appendChild(b);}
    dayEl.appendChild(lbl);

    matches.forEach(m=>{
      const st=matchStatus(m);
      const isNext=!nextRendered&&st==='upcoming';
      if(isNext)nextRendered=true;
      const isKO=m.g.length>1;
      // Para eliminatorias, usar nombre real de la API si está disponible
      const api=apiForMatch(m);
      const dispH = (isKO && api?.home) ? api.home : m.h;
      const dispA = (isKO && api?.away) ? api.away : m.a;
      const isHL=filterTeam&&(dispH===filterTeam||dispA===filterTeam);

      const card=document.createElement('div');
      card.className='match-card'+(st==='played'?' played':st==='live'?' live':isNext?' next-match':'')+(isKO?' ko':'')+(isHL?' highlighted':'');

      // Meta (grupo)
      const meta=document.createElement('div');
      meta.className='match-meta';
      meta.textContent=m.g.length===1?`Grupo ${m.g}`:(GROUP_LABELS[m.g]||m.g);
      card.appendChild(meta);

      // Equipo local
      const teamH=document.createElement('div');
      teamH.className='match-team home';
      if(!isKO){
        const fl=flagEl(m.h);
        if(fl)teamH.appendChild(fl);
        const nm=document.createElement('div');nm.className='match-team-name';nm.textContent=dispH;
        teamH.appendChild(nm);
      } else {
        const fl2=flagEl(dispH); if(fl2)teamH.appendChild(fl2);
        const nm=document.createElement('div');nm.className='match-team-ko';nm.textContent=dispH;teamH.appendChild(nm);
      }

      // Centro — score real de API si disponible
      const center=document.createElement('div');
      center.className='match-center';
      const api=apiForMatch(m);
      if(st==='played'){
        const score = (api && api.scoreH!==null) ? `${api.scoreH} – ${api.scoreA}` : '– – –';
        const ht    = (api && api.htH!==null)    ? `(${api.htH}–${api.htA}) MT` : 'FT';
        center.innerHTML=`<div class="match-result">${score}</div><div class="match-vs">${ht}</div>`;
      } else if(st==='live'){
        const score = (api && api.scoreH!==null) ? `${api.scoreH} – ${api.scoreA}` : '– –';
        center.innerHTML=`<div class="match-result">${score}</div><div class="match-live-dot">● EN VIVO</div>`;
      } else {
        center.innerHTML=`<div class="match-time">${formatTime(m.utc)}</div><div class="match-vs">vs</div>`;
      }

      // Equipo visitante
      const teamA=document.createElement('div');
      teamA.className='match-team away';
      if(!isKO){
        const fl=flagEl(m.a);
        if(fl)teamA.appendChild(fl);
        const nm=document.createElement('div');nm.className='match-team-name';nm.textContent=dispA;
        teamA.appendChild(nm);
      } else {
        const fl2=flagEl(dispA); if(fl2)teamA.appendChild(fl2);
        const nm=document.createElement('div');nm.className='match-team-ko';nm.textContent=dispA;teamA.appendChild(nm);
      }

      // Estadio
      const stad=document.createElement('div');
      stad.className='match-stadium';stad.textContent=m.s;

      card.append(teamH,center,teamA,stad);
      dayEl.appendChild(card);
    });
    body.appendChild(dayEl);
  });

  const total=filtered.length;
  document.getElementById('fix-header-sub').textContent=
    total+' partido'+(total!==1?'s':'')+
    (filterHoy?' · hoy':filterGroup?' · Grupo '+filterGroup:filterTeam?' · '+filterTeam:'')+
    ' · 11 jun – 19 jul';
}

// ── Init ─────────────────────────────────────────
try{ buildTeamDropdown(''); }catch(e){ console.warn('buildTeamDropdown:',e); }
try{ updateNextBanner(); }catch(e){ console.warn('updateNextBanner:',e); }
try{ render(); }catch(e){
  console.warn('render:',e);
  // Fallback: mostrar los partidos de forma básica si render() falla
  const fb = document.getElementById('fixBody');
  if(fb && !fb.children.length){
    fb.innerHTML = '<div style="padding:16px;font-family:monospace;font-size:12px;color:var(--ink-soft)">'+
      'Error al renderizar partidos.<br>Revisá la consola para más detalles.<br><br>'+
      'MATCHES cargados: '+MATCHES.length+'</div>';
  }
}
setInterval(()=>{ try{updateNextBanner();}catch(_){} }, 30000);
// Cargar datos en vivo de la API
try{ fetchLiveData(); }catch(e){ console.warn('fetchLiveData:',e); }
</script>
